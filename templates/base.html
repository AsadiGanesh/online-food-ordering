{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FoodExpress{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>
<nav class="navbar">

    <h2>🍔 FoodExpress</h2>

    <div>
        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'restaurant_list' %}">
            Restaurants
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'my_orders' %}">
                📋 My Orders
            </a>

            <a href="{% url 'cart' %}">
                🛒 Cart
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}
    </div>

</nav>


<main class="container">

    {% block content %}

    {% endblock %}

</main>

</body>
</html>
